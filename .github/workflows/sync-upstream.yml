name: sync-upstream

on:
  schedule: [{ cron: "0 6 * * 1" }] # lundi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Ajoute remote upstream
        run: |
          git remote add upstream https://github.com/redphx/better-xcloud.git 2>/dev/null || true
          git fetch upstream --prune
      - name: Vérifie si upstream a avancé
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/master 2>/dev/null || git rev-parse upstream/main 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_SHA" ]; then echo "has_update=false" >> $GITHUB_OUTPUT; exit 0; fi
          BASE=$(git merge-base HEAD $UPSTREAM_SHA 2>/dev/null || echo "")
          if [ "$BASE" = "$UPSTREAM_SHA" ]; then echo "has_update=false" >> $GITHUB_OUTPUT;
          else echo "has_update=true" >> $GITHUB_OUTPUT; echo "sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT; fi
          echo "upstream=$UPSTREAM_SHA base=$BASE"
      - name: Ouvre une PR de sync si besoin
        if: steps.check.outputs.has_update == 'true'
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          BRANCH="chore/sync-upstream-$(date +%Y%m%d)"
          git checkout -b $BRANCH
          git merge --no-edit ${{ steps.check.outputs.sha }} || (echo "::warning::Conflits — merge manuel requis"; exit 1)
          git push -u origin $BRANCH
          gh pr create --title "chore: sync upstream $(date +%Y-%m-%d)" --body "Sync automatique depuis redphx/better-xcloud. Vérifier les conflits et les gates." --label "sync-upstream"
