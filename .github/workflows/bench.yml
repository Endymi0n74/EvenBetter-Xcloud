name: bench

on:
  push:
  pull_request:
    # « labeled » requis : sans lui, poser le label « bench-gpu » sur une PR
    # n'émet aucun événement (défauts : opened/synchronize/reopened) et le
    # trigger label-gated du job gpu-upload reste inerte.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      gpu:
        description: "Lancer aussi le job GPU (protocole 6 seeds) — requiert un runner self-hosted avec GPU (labels : self-hosted, linux, gpu)"
        type: boolean
        default: false

jobs:
  hotloops-ratios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lance le bench CPU (parse + hot loops, sans page-eval)
        run: |
          # État machine avant/après le bench (même outil que le harnais GPU,
          # best-effort) — alimente la date/le contexte de la ligne de session
          # de check-ratios.js (bench/state-cpu-ci.before.json)
          node bench/gpu/machine-state.js before > bench/state-cpu-ci.before.json 2>/dev/null || true
          bash bench/run-all.sh --skip-page-eval > "$RUNNER_TEMP/bench-out.txt" 2>&1 || true
          node bench/gpu/machine-state.js after > bench/state-cpu-ci.after.json 2>/dev/null || true
          echo "--- sortie (dernières lignes) ---"
          tail -20 "$RUNNER_TEMP/bench-out.txt"

      - name: Tests du module de fusion du commentaire (pr-comment-merge)
        # Cas limites du commentaire PR unique (édition manuelle, markers
        # dupliqués, contenu vide, ordres de mise à jour) — échoue le job si
        # la fusion casse. Lancement local : node bench/pr-comment-merge.test.js
        run: node bench/pr-comment-merge.test.js

      - name: Build preview — contrat deux versions (stable et preview distincts)
        # Garantit la séparation des deux builds : rebuild du preview depuis
        # le stable (better-xcloud.user.js → better-xcloud-preview.user.js),
        # node --check, invariants (name/version/updateURL/matches disjoints —
        # le preview ne doit JAMAIS partager l'identité du stable ni pointer
        # son auto-update vers le latest du stable) + self-test P1 keep-alive.
        # Échoue le job si une évolution du stable casse le preview ou la
        # séparation. Lancement local : node bench/preview/port/build-preview.js
        run: |
          node bench/preview/port/build-preview.js
          node bench/preview/port/keepalive-idle.test.js
          # t10-auto-spoof : gate vm de l'auto-spoof UA (T10) — extraction du
          # statement du build preview + pureté du stable (guard BX_PREVIEW)
          # + comportement vm sur mock UserAgent (Firefox/Safari → spoof,
          # Edge/Chrome/Crios → inchangé, profil explicite jamais écrasé).
          # Échoue le job si la logique d'auto-spoof dérive. Self-test du
          # chemin d'échec : node bench/preview/port/t10-auto-spoof.test.js
          # --self-test
          node bench/preview/port/t10-auto-spoof.test.js
          # feature-datasaver : gate vm de la feature « 📊 Données » (v1.11.0).
          # Le build preview hérite du stable (la feature y est embarquée) :
          # le test vérifie sa présence dans les DEUX builds, que les 3 ancres
          # d'injection tiennent dans le bundle stable, puis rejoue
          # l'injection + le chemin d'échec (--self-test de feature-datasaver.js)
          # sur une copie sans feature. Échoue le job si un rebuild oublie
          # l'injection ou si une ancre dérive. Lancement local :
          # node bench/feature-datasaver.test.js
          node bench/feature-datasaver.test.js
          # p2-schema : alerte si une clé P2 dérive du schéma Zod réel (un
          # bundle StreamSessionConfiguration-*.js capturé doit être présent,
          # sinon le test passe en mode « schéma non vérifiable » — warn +
          # cohérence interne de p2-inject.js, exit 0). En local, lancer avec
          # le répertoire de capture : node bench/preview/p2-schema.test.js
          node bench/preview/p2-schema.test.js
          # Étape 0 E2E (gates A/B/D) : document-start viable (fetch-early),
          # réécriture P2+P3 en vm (userscript-rewrite) et chronologie du play
          # (play-chain) — échoue le job si un gate est rouge (la logique
          # dérive : ancres/minifier). Probe C ignoré (pas de navigateur CDP
          # en CI) ; play-chain en soft sans bundles capturés → warning, exit 0.
          # En local : bash bench/preview/port/run-e2e0.sh [--dir=<capture>]
          bash bench/preview/port/run-e2e0.sh --skip-probe

      - name: Vérifie les ratios des hot loops (seuils CI)
        run: |
          # le résumé markdown inclut la ligne de session (état haut/bas +
          # date depuis la capture d'état) prête pour le tableau « Sessions
          # hot loops » de bench/README.md
          node bench/check-ratios.js "$RUNNER_TEMP/bench-out.txt" --markdown="$RUNNER_TEMP/bench-summary.md"
          echo "summary=$RUNNER_TEMP/bench-summary.md" >> "$GITHUB_ENV"

      - name: Upload du résumé hot loops (tableau + ligne de session prête pour bench/README.md)
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary-${{ github.sha }}
          path: ${{ runner.temp }}/bench-summary.md
          if-no-files-found: error

      - name: Upload bench-out.txt (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-out-${{ github.sha }}
          path: ${{ runner.temp }}/bench-out.txt
          if-no-files-found: error

      - name: Commente la PR — section hot loops (fusion dans un seul commentaire)
        # Script partagé avec le job startup-cold (PR_COMMENT_MODE) : chaque job
        # met à jour SA section dans le même commentaire (markers <!-- bench-
        # ratios --> / <!-- bench-startup -->) en préservant l'autre.
        # Les PR de forks ont un token read-only : commenter 403 → la garde
        # head.repo == github.repository restreint le commentaire aux PR internes.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        env:
          PR_COMMENT_MODE: hotloops
          PR_COMMENT_SECTION: ${{ runner.temp }}/bench-summary.md
        with:
          script: |
            const fs = require('fs');
            const { mergeComment } = require(process.env.GITHUB_WORKSPACE + '/bench/pr-comment-merge.js');
            const mode = process.env.PR_COMMENT_MODE;
            const sectionPath = process.env.PR_COMMENT_SECTION;
            // Job échoué avant la production du résumé (ex. gate rouge au build) :
            // le fichier n'existe pas → skip propre au lieu d'un crash ENOENT.
            if (!fs.existsSync(sectionPath)) {
              console.log('résumé absent (' + sectionPath + ') — échec avant sa production, commentaire skippé (' + mode + ')');
              return;
            }
            const section = fs.readFileSync(sectionPath, 'utf8').trimEnd();
            const MAIN = '<!-- bench-ratios -->';
            const opts = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const { data: comments } = await github.rest.issues.listComments({ ...opts, per_page: 100 });
            const existing = comments.find((c) => c.body.includes(MAIN));
            const newBody = mergeComment(existing ? existing.body : '', mode, section);
            if (existing) {
              await github.rest.issues.updateComment({ ...opts, comment_id: existing.id, body: newBody });
            } else {
              await github.rest.issues.createComment({ ...opts, body: newBody });
            }
            console.log((existing ? 'commentaire mis à jour' : 'commentaire créé') + ' (' + mode + ')');

  # Protocole froid (pull_request + workflow_dispatch) : éval page à froid
  # (navigateur neuf par run) sur le runner SELF-HOSTED Windows — les bornes
  # mesurées (build ~30 ms, perf10 550-660 ms) sont spécifiques à Edge/Windows
  # (pile RTC et one-shot), le job ubuntu n'a ni Playwright ni les mêmes
  # chiffres. Alerte à chaque changement du script via les PR de branches
  # internes (les PR de forks ne peuvent pas utiliser les runners self-hosted,
  # le job reste alors en attente/skip). Runner partagé avec le job GPU.
  # Runner : self-hosted, windows, gpu.
  startup-cold:
    # GitHub bloque les runners self-hosted (tout OS) pour les PR de forks des
    # repos publics → job limité aux PR INTERNES + dispatches (les forks ne
    # laissent plus de job en attente ; leur startup est couvert par
    # startup-cold-fork sur ubuntu-latest).
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, gpu]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe Playwright (module npm — canal msedge, natif Windows)
        run: npm install playwright

      - name: Éval page à froid (20 runs, navigateur neuf par run)
        shell: bash
        run: |
          git show 055d3a0:better-xcloud.user.js > perf10.js
          node bench/page-eval.js --cold perf10.js better-xcloud.user.js > "${{ runner.temp }}/cold-eval.txt"
          echo "--- sortie ---"
          cat "${{ runner.temp }}/cold-eval.txt"

      - name: Vérifie la borne de startup (build ≤ 50 ms, perf10 300-1200 ms)
        run: node bench/check-ratios.js "${{ runner.temp }}/cold-eval.txt" --startup-only --markdown="${{ runner.temp }}/startup-summary.md"

      - name: Upload du résumé startup (bornes CI)
        uses: actions/upload-artifact@v4
        with:
          name: startup-summary-${{ github.sha }}
          path: ${{ runner.temp }}/startup-summary.md
          if-no-files-found: error

      - name: Commente la PR — section startup (fusion dans le commentaire hot loops)
        # Même script que le job hotloops-ratios (PR_COMMENT_MODE=startup) : la
        # section startup rejoint le tableau hot loops dans UN SEUL commentaire.
        # Les PR de forks ont un token read-only : commenter 403 → la garde
        # head.repo == github.repository restreint le commentaire aux PR internes.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        env:
          PR_COMMENT_MODE: startup
          PR_COMMENT_SECTION: ${{ runner.temp }}/startup-summary.md
        with:
          script: |
            const fs = require('fs');
            const { mergeComment } = require(process.env.GITHUB_WORKSPACE + '/bench/pr-comment-merge.js');
            const mode = process.env.PR_COMMENT_MODE;
            const sectionPath = process.env.PR_COMMENT_SECTION;
            // Job échoué avant la production du résumé (ex. gate rouge au build) :
            // le fichier n'existe pas → skip propre au lieu d'un crash ENOENT.
            if (!fs.existsSync(sectionPath)) {
              console.log('résumé absent (' + sectionPath + ') — échec avant sa production, commentaire skippé (' + mode + ')');
              return;
            }
            const section = fs.readFileSync(sectionPath, 'utf8').trimEnd();
            const MAIN = '<!-- bench-ratios -->';
            const opts = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const { data: comments } = await github.rest.issues.listComments({ ...opts, per_page: 100 });
            const existing = comments.find((c) => c.body.includes(MAIN));
            const newBody = mergeComment(existing ? existing.body : '', mode, section);
            if (existing) {
              await github.rest.issues.updateComment({ ...opts, comment_id: existing.id, body: newBody });
            } else {
              await github.rest.issues.createComment({ ...opts, body: newBody });
            }
            console.log((existing ? 'commentaire mis à jour' : 'commentaire créé') + ' (' + mode + ')');

      - name: Upload cold-eval.txt (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-eval-${{ github.sha }}
          path: ${{ runner.temp }}/cold-eval.txt
          if-no-files-found: error

  # PR EXTERNES (forks) : GitHub bloque les runners self-hosted (tout OS) pour
  # les PR de forks des repos publics — règle de sécurité plateforme. La seule
  # couverture possible des forks : runner GitHub-hosted ubuntu-latest (autorisé
  # pour les forks, gratuit pour les repos publics). Edge est préinstallé sur
  # l'image ubuntu → même canal msedge, même moteur que le runner Windows → les
  # bornes (build ≤ 50 ms, perf10 300-1200 ms) s'appliquent telles quelles.
  # Le job tourne sur TOUTES les PR : les PR internes l'exercent en continu
  # (validation permanente du chemin), et il devient l'unique check startup des
  # PR de forks. Token read-only sur les forks : pas de commentaire — résultat
  # en artefact (startup-summary-fork-<sha>) + statut du check.
  startup-cold-fork:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe Playwright (module npm — Edge système préinstallé, pas de navigateur à télécharger)
        run: npm install playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Éval page à froid (20 runs, navigateur neuf par run — Edge système)
        shell: bash
        run: |
          git show 055d3a0:better-xcloud.user.js > perf10.js
          node bench/page-eval.js --cold perf10.js better-xcloud.user.js > "${{ runner.temp }}/cold-eval-fork.txt"
          echo "--- sortie ---"
          cat "${{ runner.temp }}/cold-eval-fork.txt"

      - name: Vérifie la borne de startup (build ≤ 50 ms, perf10 15-200 ms Linux)
        # Sous Linux/Edge il n'y a PAS de one-shot RTC (mesuré : perf10 ≈ build
        # ~40 ms, vs ~570 ms sur Windows) → bande perf10 dédiée ; la borne build
        # ≤ 50 ms (médiane) reste le vrai garde-fou, identique au runner Windows.
        run: node bench/check-ratios.js "${{ runner.temp }}/cold-eval-fork.txt" --startup-only --markdown="${{ runner.temp }}/startup-summary-fork.md"
        env:
          STARTUP_P10_MIN_MS: 15
          STARTUP_P10_MAX_MS: 200

      - name: Upload du résumé startup (PR externe — pas de commentaire possible)
        uses: actions/upload-artifact@v4
        with:
          name: startup-summary-fork-${{ github.sha }}
          path: ${{ runner.temp }}/startup-summary-fork.md
          if-no-files-found: error

      - name: Upload cold-eval-fork.txt (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-eval-fork-${{ github.sha }}
          path: ${{ runner.temp }}/cold-eval-fork.txt
          if-no-files-found: error

  # Optionnel (workflow_dispatch + input « gpu », ou PR interne labelisée
  # « bench-gpu ») : protocole GPU 6 seeds sur un runner SELF-HOSTED avec GPU
  # (les runners GitHub hébergés n'en ont pas). Machine de référence : Windows
  # (RTX 3070) — canal msedge (GPU via ANGLE/D3D11), le même stack que les
  # tables GPU de bench/README.md. Les seuils de check-gpu.js sont volontairement bas
  # (machine/driver) — le vrai signal est le ratio upload perf10/build (≥ 1,3)
  # et les compteurs GL (chemin fonctionnel). Runner : labels self-hosted,
  # Windows, X64, gpu. Le trigger PR (label « bench-gpu », PR internes
  # uniquement — les forks ne peuvent pas utiliser les runners self-hosted)
  # permet au protocole de rejoindre le récapitulatif PR via le commentaire.
  gpu-upload:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.gpu == 'true') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'bench-gpu'))
    runs-on: [self-hosted, windows, gpu]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe Playwright (module npm — canal msedge, natif Windows)
        run: npm install playwright

      - name: Génère la vidéo de test (test.webm, gitignoré)
        run: node bench/gpu/gen-video.js bench/gpu/test.webm --channel=msedge

      - name: Protocole figé — 6 seeds × 3 passes (upload, wallTotal, draw)
        # Windows : les run: multi-lignes bash nécessitent shell: bash (le
        # défaut PowerShell ne comprend ni les continuations « \ » ni $S)
        shell: bash
        run: |
          for S in 100 200 300 400 500 600; do
            echo "== seed $S =="
            node bench/gpu/machine-state.js before > bench/gpu/state-s$S.before.json 2>/dev/null || true
            node bench/gpu/gpu-runner.js \
              --cls-p10=bench/gpu/gpu-perf10-webgl2player.txt \
              --cls-new=bench/gpu/gpu-v160-webgl2player.txt \
              --label-new=v1.6.0 \
              --no-fix --frames=120 --passes=3 --seed=$S \
              --channel=msedge \
              > bench/gpu/run-s$S.json || exit 1
            node bench/gpu/machine-state.js after > bench/gpu/state-s$S.after.json 2>/dev/null || true
          done
          # label-new doit correspondre à --label-new de gpu-runner.js (sinon
          # agg-seeds cherche res.agg[« v1.4.0 »] et crash sur des runs v1.6.0)
          node bench/gpu/agg-seeds.js --label-new=v1.6.0 100 200 300 400 500 600

      - name: Vérifie upload / wallTotal / draw + chemin GL (résumé markdown avec ligne de session)
        # ${{ runner.temp }} (expression GitHub) plutôt que $RUNNER_TEMP : le
        # shell par défaut de Windows est PowerShell, qui n'expand pas la
        # variable d'env bash (chemin vide → écriture à la racine C:\ → EPERM)
        run: node bench/gpu/check-gpu.js 100 200 300 400 500 600 --markdown="${{ runner.temp }}/gpu-summary.md"

      - name: Upload du résumé GPU (tableau + ligne de session prête à coller dans bench/README.md)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-summary-${{ github.sha }}
          path: ${{ runner.temp }}/gpu-summary.md
          if-no-files-found: error

      - name: Validation visuelle du shader — gate USM 4 taps vs 9 taps (bloque si le rendu diverge)
        # visual-diff.js rend v1.6.0 (9 taps) / v1.7.0 (4 taps) / perf10 sur
        # une vidéo de texte fin (générée ici, test-text.webm gitignoré) dans le
        # vrai backend msedge/ANGLE, et diff pixel à pixel : identité sharpness 0
        # = maxAbs 0, isolation CAS + équivalence sharp 2/10 = ±1/255. Exit 0/1 :
        # une régression de rendu qui passerait le protocole de performance
        # (le ratio ne bouge pas, le rendu peut changer) échoue le job ICI.
        run: node bench/gpu/visual-diff.js

      - name: Génère le rapport HTML autonome (montages embarqués en base64)
        # Toujours tourner (même gate rouge) pour garder les montages qui
        # expliquent l'échec ; le rapport JSON + shots/ sont écrits avant le
        # exit 1 de visual-diff.js.
        if: always()
        run: node bench/gpu/report-html.js

      - name: Upload des artefacts visuels (rapport HTML + montages/heatmaps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.sha }}
          path: |
            bench/gpu/visual-diff-report.html
            bench/gpu/shots/
          # warn (pas error) : si le harnais a crashé avant d'écrire le rapport,
          # l'artefact est absent mais le job est déjà rouge.
          if-no-files-found: warn

      - name: Commente la PR — section GPU (fusion dans le commentaire hot loops)
        # Même script partagé que les jobs hotloops/startup (PR_COMMENT_MODE=gpu,
        # marker <!-- bench-gpu -->). Le job GPU est dispatch-only ou label-gated :
        # ce step ne s'active que sur pull_request (un dispatch n'a pas de PR à
        # commenter) — le protocole 6 seeds rejoint le récapitulatif unique quand
        # il tourne dans un contexte PR (label « bench-gpu » sur une PR interne).
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        env:
          PR_COMMENT_MODE: gpu
          PR_COMMENT_SECTION: ${{ runner.temp }}/gpu-summary.md
        with:
          script: |
            const fs = require('fs');
            const { mergeComment } = require(process.env.GITHUB_WORKSPACE + '/bench/pr-comment-merge.js');
            const mode = process.env.PR_COMMENT_MODE;
            const sectionPath = process.env.PR_COMMENT_SECTION;
            // Job échoué avant la production du résumé (ex. gate rouge au build) :
            // le fichier n'existe pas → skip propre au lieu d'un crash ENOENT.
            if (!fs.existsSync(sectionPath)) {
              console.log('résumé absent (' + sectionPath + ') — échec avant sa production, commentaire skippé (' + mode + ')');
              return;
            }
            const section = fs.readFileSync(sectionPath, 'utf8').trimEnd();
            const MAIN = '<!-- bench-ratios -->';
            const opts = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const { data: comments } = await github.rest.issues.listComments({ ...opts, per_page: 100 });
            const existing = comments.find((c) => c.body.includes(MAIN));
            const newBody = mergeComment(existing ? existing.body : '', mode, section);
            if (existing) {
              await github.rest.issues.updateComment({ ...opts, comment_id: existing.id, body: newBody });
            } else {
              await github.rest.issues.createComment({ ...opts, body: newBody });
            }
            console.log((existing ? 'commentaire mis à jour' : 'commentaire créé') + ' (' + mode + ')');

      - name: Upload des runs GPU (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-runs-${{ github.sha }}
          path: bench/gpu/run-s*.json
          if-no-files-found: error
