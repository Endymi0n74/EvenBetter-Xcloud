name: bench

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: "Lancer aussi le job GPU (protocole 6 seeds) — requiert un runner self-hosted avec GPU (labels : self-hosted, linux, gpu)"
        type: boolean
        default: false

jobs:
  hotloops-ratios:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lance le bench CPU (parse + hot loops, sans page-eval)
        run: |
          # État machine avant/après le bench (même outil que le harnais GPU,
          # best-effort) — alimente la date/le contexte de la ligne de session
          # de check-ratios.js (bench/state-cpu-ci.before.json)
          node bench/gpu/machine-state.js before > bench/state-cpu-ci.before.json 2>/dev/null || true
          bash bench/run-all.sh --skip-page-eval > "$RUNNER_TEMP/bench-out.txt" 2>&1 || true
          node bench/gpu/machine-state.js after > bench/state-cpu-ci.after.json 2>/dev/null || true
          echo "--- sortie (dernières lignes) ---"
          tail -20 "$RUNNER_TEMP/bench-out.txt"

      - name: Vérifie les ratios des hot loops (seuils CI)
        run: |
          # le résumé markdown inclut la ligne de session (état haut/bas +
          # date depuis la capture d'état) prête pour le tableau « Sessions
          # hot loops » du README
          node bench/check-ratios.js "$RUNNER_TEMP/bench-out.txt" --markdown="$RUNNER_TEMP/bench-summary.md"
          echo "summary=$RUNNER_TEMP/bench-summary.md" >> "$GITHUB_ENV"

      - name: Upload du résumé hot loops (tableau + ligne de session prête pour le README)
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary-${{ github.sha }}
          path: ${{ runner.temp }}/bench-summary.md
          if-no-files-found: error

      - name: Upload bench-out.txt (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-out-${{ github.sha }}
          path: ${{ runner.temp }}/bench-out.txt
          if-no-files-found: error

      - name: Commente la PR avec le tableau des ratios (créé puis mis à jour)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.RUNNER_TEMP + '/bench-summary.md', 'utf8');
            const marker = '<!-- bench-ratios -->';
            const body = summary + '\n' + marker;
            const opts = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const { data: comments } = await github.rest.issues.listComments({
              ...opts,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...opts,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...opts,
                issue_number: context.issue.number,
                body,
              });
            }
            console.log(existing ? 'commentaire mis à jour' : 'commentaire créé');

  # Protocole froid (pull_request + workflow_dispatch) : éval page à froid
  # (navigateur neuf par run) sur le runner SELF-HOSTED Windows — les bornes
  # mesurées (build ~30 ms, perf10 550-660 ms) sont spécifiques à Edge/Windows
  # (pile RTC et one-shot), le job ubuntu n'a ni Playwright ni les mêmes
  # chiffres. Alerte à chaque changement du script via les PR de branches
  # internes (les PR de forks ne peuvent pas utiliser les runners self-hosted,
  # le job reste alors en attente/skip). Runner partagé avec le job GPU.
  # Runner : self-hosted, windows, gpu.
  startup-cold:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, gpu]
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe Playwright (module npm — canal msedge, natif Windows)
        run: npm install playwright

      - name: Éval page à froid (20 runs, navigateur neuf par run)
        shell: bash
        run: |
          git show 055d3a0:better-xcloud.user.js > perf10.js
          node bench/page-eval.js --cold perf10.js better-xcloud.user.js > "${{ runner.temp }}/cold-eval.txt"
          echo "--- sortie ---"
          cat "${{ runner.temp }}/cold-eval.txt"

      - name: Vérifie la borne de startup (build ≤ 50 ms, perf10 300-1200 ms)
        run: node bench/check-ratios.js "${{ runner.temp }}/cold-eval.txt" --startup-only --markdown="${{ runner.temp }}/startup-summary.md"

      - name: Upload du résumé startup (bornes CI)
        uses: actions/upload-artifact@v4
        with:
          name: startup-summary-${{ github.sha }}
          path: ${{ runner.temp }}/startup-summary.md
          if-no-files-found: error

      - name: Upload cold-eval.txt (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-eval-${{ github.sha }}
          path: ${{ runner.temp }}/cold-eval.txt
          if-no-files-found: error

  # Optionnel (workflow_dispatch + input « gpu ») : protocole GPU 6 seeds sur
  # un runner SELF-HOSTED avec GPU (les runners GitHub hébergés n'en ont pas).
  # Machine de référence : Windows (RTX 3070) — canal msedge (GPU via
  # ANGLE/D3D11), le même stack que les tables GPU du README. Les seuils de
  # check-gpu.js sont volontairement bas (machine/driver) — le vrai signal est
  # le ratio upload perf10/build (≥ 1,3) et les compteurs GL (chemin
  # fonctionnel). Runner : labels self-hosted, Windows, X64, gpu.
  gpu-upload:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.gpu == 'true'
    runs-on: [self-hosted, windows, gpu]
    steps:
      - name: Checkout (historique complet — la baseline perf10 055d3a0 est requise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe Playwright (module npm — canal msedge, natif Windows)
        run: npm install playwright

      - name: Génère la vidéo de test (test.webm, gitignoré)
        run: node bench/gpu/gen-video.js bench/gpu/test.webm --channel=msedge

      - name: Protocole figé — 6 seeds × 3 passes (upload, wallTotal, draw)
        # Windows : les run: multi-lignes bash nécessitent shell: bash (le
        # défaut PowerShell ne comprend ni les continuations « \ » ni $S)
        shell: bash
        run: |
          for S in 100 200 300 400 500 600; do
            echo "== seed $S =="
            node bench/gpu/machine-state.js before > bench/gpu/state-s$S.before.json 2>/dev/null || true
            node bench/gpu/gpu-runner.js \
              --cls-p10=bench/gpu/gpu-perf10-webgl2player.txt \
              --cls-new=bench/gpu/gpu-v160-webgl2player.txt \
              --label-new=v1.6.0 \
              --no-fix --frames=120 --passes=3 --seed=$S \
              --channel=msedge \
              > bench/gpu/run-s$S.json || exit 1
            node bench/gpu/machine-state.js after > bench/gpu/state-s$S.after.json 2>/dev/null || true
          done
          # label-new doit correspondre à --label-new de gpu-runner.js (sinon
          # agg-seeds cherche res.agg[« v1.4.0 »] et crash sur des runs v1.6.0)
          node bench/gpu/agg-seeds.js --label-new=v1.6.0 100 200 300 400 500 600

      - name: Vérifie upload / wallTotal / draw + chemin GL (résumé markdown avec ligne de session)
        # ${{ runner.temp }} (expression GitHub) plutôt que $RUNNER_TEMP : le
        # shell par défaut de Windows est PowerShell, qui n'expand pas la
        # variable d'env bash (chemin vide → écriture à la racine C:\ → EPERM)
        run: node bench/gpu/check-gpu.js 100 200 300 400 500 600 --markdown="${{ runner.temp }}/gpu-summary.md"

      - name: Upload du résumé GPU (tableau + ligne de session prête à coller dans le README)
        uses: actions/upload-artifact@v4
        with:
          name: gpu-summary-${{ github.sha }}
          path: ${{ runner.temp }}/gpu-summary.md
          if-no-files-found: error

      - name: Upload des runs GPU (en cas d'échec uniquement)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-runs-${{ github.sha }}
          path: bench/gpu/run-s*.json
          if-no-files-found: error
